name: Deploy to Mau

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Mau
        run: npx @nestjs/mau deploy
        env:
          MAU_API_KEY: ${{ secrets.MAU_API_KEY }}
          MAU_API_SECRET: ${{ secrets.MAU_API_SECRET }}