name: Deploy to Mau

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # mau's default base image is node:24.18.0-bullseye-slim, and bullseye is end of life
      # (apt-get gets 404s from debian-security). same node version, bookworm
      - name: Deploy to Mau
        run: npx @nestjs/mau deploy --image node:24.18.0-bookworm-slim
        env:
          MAU_KEY: ${{ secrets.MAU_API_KEY }}
          MAU_SECRET: ${{ secrets.MAU_API_SECRET }}